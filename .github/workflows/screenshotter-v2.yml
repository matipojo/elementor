name: Elementor-ScreenShotter v2

on: [ push, pull_request ]

jobs:
  build-plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
      - name: Install Node.js 14.x
        uses: actions/setup-node@v2
        with:
          node-version: 14.x
      - name: Cache node modules
        uses: actions/cache@v2
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npx grunt build-assets
      - name: Save build to cache
        uses: actions/cache@v2
        id: restore-build
        with:
          path: ./build/*
          key: ${{ github.sha }}

  screenshotter:
    name: ScreenShotter v2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@master
      - name: Install Dependencies
        run: |
          cd ${{ github.workspace }}/tests/screenshotter
          npm i
      - name: Install WordPress environment
        run: |
          cd ${{ github.workspace }}/tests/screenshotter
          wp-env start
          wp-env run cli theme activate hello-elementor
          wp-env run cli option set blogname test
      - name: Import Templates
        run: |
          cd ${{ github.workspace }}/tests/screenshotter
          wp-env run cli "wp --user=admin elementor library import_dir /var/www/html/wp-content/plugins/elementor/tests/screenshotter/config"
      - name: Run Tests
        run: |
          cd ${{ github.workspace }}/tests/screenshotter
          node ./node_modules/backstopjs/cli/index.js test --config=${{ github.workspace }}/tests/screenshotter/backstop.js
      - uses: actions/upload-artifact@master
        if: failure()
        with:
          name: backstop-output
          path: ${{ github.workspace }}/tests/screenshotter/backstop_data
